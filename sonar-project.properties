# SonarQube analysis for bkk-risk-api (run scanner from repo root)
sonar.projectKey=bkk-risk-api
sonar.projectName=bkk-risk-api
sonar.projectVersion=1.0.0
sonar.sources=bkk-risk-api/src
sonar.tests=bkk-risk-api/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.typescript.lcov.reportPaths=bkk-risk-api/coverage/lcov.info
sonar.javascript.lcov.reportPaths=bkk-risk-api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
